services:
  krumble-scraper:
    build: .
    container_name: krumble-scraper-${PLUGIN_INSTANCE_ID:-default}
    networks:
      - simplex-net
    environment:
      - PLUGIN_API_PORT=8001
      - PLUGIN_NAME=${PLUGIN_NAME:-krumble}
    ports:
      - "8001:8001"  # Internal communication
    restart: unless-stopped
    labels:
      - "simplex.plugin=krumble"
      - "simplex.plugin.api.port=8001"
      - "simplex.plugin.health=/health"
    volumes:
      - ./screenshots:/app/screenshots
      - ./data:/app/data
      - ./channel_data:/app/channel_data
    command: node api_server.js

networks:
  simplex-net:
    external: true