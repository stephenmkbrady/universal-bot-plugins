# Rumble Plugin Configuration

monitoring:
  # How often to check channels for updates (minutes)
  check_interval_minutes: 5
  
  # Enable/disable monitoring
  enabled: true
  
  # Maximum retries for failed checks
  max_retries: 3
  
  # Timeout for scraper operations (seconds)
  timeout_seconds: 30

detection:
  # Detect when videos/streams are removed
  detect_removed: true
  
  # Detect when live status changes (live -> ended)
  detect_live_status_changes: true
  
  # Take screenshot when blocked by anti-bot protection
  screenshot_on_block: true

# Message templates for notifications
messages:
  new_stream: "🔴 **New Rumble Stream:** {title}\n🔗 {url}\n📅 {time}"
  new_video: "📺 **New Rumble Video:** {title}\n🔗 {url}\n📅 {time}"
  stream_ended: "⚫ **Stream Ended:** {title}"
  blocked: "🚫 **Rumble Monitor Blocked:** Channel {channel} may have anti-bot protection"
  error: "❌ **Rumble Monitor Error:** {error}"
  added: "✅ **Added Rumble Channel:** {channel}\n📺 Monitoring for: {context_type}"
  removed: "🗑️ **Removed Rumble Channel:** {channel}"
  not_found: "❌ **Channel not found:** {channel}"

# Advanced settings
advanced:
  # Browser user agent for scraping
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  
  # Maximum number of channels per context
  max_channels_per_context: 10
  
  # Data retention days
  data_retention_days: 30